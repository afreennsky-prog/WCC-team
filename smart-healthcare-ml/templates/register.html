<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareQueue | Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body class="auth-body">
    <div class="auth-shell">
      <div class="auth-card">
        <div class="brand auth-brand">
          <div class="brand-mark">+</div>
          <span>CareQueue</span>
        </div>

        <div class="auth-header">
          <span class="eyebrow">Create account</span>
          <h1>Register as a patient</h1>
        </div>

        <form class="auth-form" id="registerForm">
          <label>
            <span>Full name</span>
            <input type="text" name="name" placeholder="Enter your full name" required />
          </label>

          <div class="two-col">
            <label>
              <span>Age</span>
              <input type="number" name="age" min="1" max="120" required />
            </label>
            <label>
              <span>Gender</span>
              <select name="gender">
                <option>Female</option>
                <option>Male</option>
                <option>Other</option>
              </select>
            </label>
          </div>

          <label>
            <span>Email</span>
            <input type="email" name="email" placeholder="you@example.com" required />
          </label>

          <label>
            <span>Phone</span>
            <input type="tel" name="phone" placeholder="+91 98765 43210" />
          </label>

          <label>
            <span>Preferred department</span>
            <select name="department">
              {% for specialty in specialties %}
              <option value="{{ specialty }}">{{ specialty }} — {{ specialty_descriptions[specialty] }}</option>
              {% endfor %}
            </select>
          </label>

          <label>
            <span>Password (at least 8 characters)</span>
            <input type="password" name="password" autocomplete="new-password" minlength="8" required />
          </label>

          <button type="submit" class="btn btn-primary auth-submit">Create account</button>
        </form>
        <p id="registrationMessage" class="auth-footer" role="status"></p>

        <p class="auth-footer">
          Already registered?
          <a href="{{ url_for('login') }}">Login</a>
        </p>
      </div>
    </div>

    <script>
      document.getElementById('registerForm').addEventListener('submit', async function (event) {
        event.preventDefault();
        const form = event.target;
        const payload = Object.fromEntries(new FormData(form).entries());
        const message = document.getElementById('registrationMessage');
        message.textContent = '';
        try {
          const response = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const result = await response.json();
          if (!response.ok || !result.success) throw new Error(result.message || 'Registration failed.');
          window.location.href = result.redirect || '/patient-portal';
        } catch (error) {
          message.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
