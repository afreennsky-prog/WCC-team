<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareQueue | Create Doctor Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body class="auth-body">
    <div class="auth-shell">
      <div class="auth-card">
        <div class="brand auth-brand">
          <div class="brand-mark">+</div>
          <span>CareQueue</span>
        </div>

        <div class="auth-header">
          <span class="eyebrow">Doctor access</span>
          <h1>Create a doctor login</h1>
        </div>

        <form id="doctorRegisterForm" class="auth-form">
          <label>
            <span>Doctor name</span>
            <input type="text" name="name" maxlength="100" placeholder="Full name" required />
          </label>
          <label>
            <span>Username</span>
            <input type="text" name="username" maxlength="40" pattern="[A-Za-z0-9._-]+" autocomplete="username" placeholder="e.g. dr.smith" required />
          </label>
          <label>
            <span>Medical specialty / department</span>
            <select name="specialty" required>
              <option value="">Choose your specialty</option>
              {% for specialty in specialties %}
              <option value="{{ specialty }}">{{ specialty }} — {{ specialty_descriptions[specialty] }}</option>
              {% endfor %}
            </select>
          </label>
          <label>
            <span>Password (at least 8 characters)</span>
            <input type="password" name="password" minlength="8" autocomplete="new-password" required />
          </label>
          <button class="btn btn-primary auth-submit" type="submit">Create doctor account</button>
        </form>

        <p id="doctorRegisterMessage" class="auth-footer" role="status"></p>
        <p class="auth-footer">Already have a doctor login? <a href="{{ url_for('doctor_login') }}">Sign in</a></p>
        <p class="auth-footer">Demo application: restrict this page to authorized administrators before using it in a real clinic.</p>
      </div>
    </div>

    <script>
      document.getElementById('doctorRegisterForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const message = document.getElementById('doctorRegisterMessage');
        message.textContent = '';
        try {
          const response = await fetch('/api/doctor-register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(Object.fromEntries(new FormData(event.currentTarget).entries()))
          });
          const result = await response.json();
          if (!response.ok || !result.success) throw new Error(result.message || 'Could not create doctor account.');
          window.location.href = result.redirect || '/doctor-panel';
        } catch (error) {
          message.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
